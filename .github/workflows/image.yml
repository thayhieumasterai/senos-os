# Public repo only (written by saas/release/publish_public.py, not used in the private repo).
# Every release push that changes VERSION builds the Docker image ghcr.io/thayhieumasterai/senos-os
# (:latest and :<VERSION>) through docker-publish.yml. It can also be run by hand from the Actions tab.
name: Docker image

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    uses: ./.github/workflows/docker-publish.yml
    with:
      ref: main
    secrets: inherit
