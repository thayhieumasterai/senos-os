name: Tạo plugin qua chat
name_en: "Plugins from chat"
slug: senos-plugin
version: 1.0.0
description: Cho SenOS tạo, đọc và sửa plugin của người dùng ngay tại chỗ khi được nhờ trong chat, không phải tải file zip về rồi tải lên lại. Plugin mới hoặc vừa đổi mã luôn nằm TẮT, chủ đọc mã rồi tự bật ở trang Tiện ích. Chỉ phiên của chủ thấy tool này.
description_en: "Lets SenOS create, read and edit your own plugins in place when you ask in chat, instead of handing you a zip to download and upload again. A new plugin, or one whose code just changed, always stays OFF until you read it and turn it on in the Add-ons page. Only the owner's own sessions see this tool."
author: SenOS (bundled)
enabled: true
min_mode: safe
tools:
  - senos_plugin
hooks: []
