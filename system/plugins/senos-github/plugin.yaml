name: GitHub trong khung chat
name_en: "GitHub in chat"
slug: senos-github
version: 1.1.0
description: Xem trạng thái repo GitHub của khung chat (nhánh, PR, CI, merge), xếp việc kế tiếp để SenOS tự làm khi PR hiện tại đã merge xong, và review chéo PR khi người dùng yêu cầu.
description_en: "Shows the chat's GitHub repos (branch, PR, CI, merge), queues the next job, which SenOS starts on its own once the current PR is merged, and cross-reviews a PR when the user asks."
author: SenOS (bundled)
enabled: true
min_mode: safe
tools:
  - senos_github
hooks: []
