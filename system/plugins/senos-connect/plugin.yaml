name: Đấu thêm MCP
name_en: "Connect an MCP server"
slug: senos-connect
version: 1.0.0
description: Đấu một MCP server vào kho Ứng dụng của SenOS ngay từ chat, để nó HIỆN ra trang Ứng dụng như mọi tài khoản khác. Trước tool này SenOS chỉ còn đường `claude mcp add` - thứ rơi vào config riêng của Claude Code, không bộ não nào khác thấy và người dùng cũng không thấy trên trang Ứng dụng.
description_en: "Adds an MCP server to SenOS's connection store right from chat, so it SHOWS on the Apps page like any other account. Before this tool the only route was `claude mcp add`, which lands in Claude Code's own config: no other brain sees it and neither do you on the Apps page."
author: SenOS (bundled)
enabled: true
min_mode: safe
tools:
  - senos_add_mcp
hooks: []
